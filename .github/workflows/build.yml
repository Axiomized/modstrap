name: Build ModStrap

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET 6 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore dependencies
        run: dotnet restore Bloxstrap.sln

      - name: Build
        run: dotnet build Bloxstrap.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Bloxstrap/Bloxstrap.csproj --configuration Release --output ./publish --self-contained false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModStrap-Build
          path: ./publish
